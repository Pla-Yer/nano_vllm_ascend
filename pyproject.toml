[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovllm-ascend"
version = "0.1.0"
description = "Minimal Qwen3 Ascend NPU batch prefill plus paged decode runtime."
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "torch",
    "transformers",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]
